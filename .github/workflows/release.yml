name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          LIVEFEED_GOOGLE_CLIENT_ID: ${{ secrets.LIVEFEED_GOOGLE_CLIENT_ID }}
          LIVEFEED_GOOGLE_CLIENT_SECRET: ${{ secrets.LIVEFEED_GOOGLE_CLIENT_SECRET }}
      - run: npm publish --access public --provenance
